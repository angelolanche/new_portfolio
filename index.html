<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/favicon.svg" fetchpriority="high" />
    <link
      rel="preload"
      as="image"
      href="/media/loading-tv-sketch.jpg"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/media/loading-tether.svg"
      fetchpriority="high"
    />
    <link rel="canonical" href="https://angeloaosol.xyz/" />
    <meta
      name="description"
      content="Creative technologist Angelo AoSol presents moving images, installations, and visual experiments in an interactive portfolio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://angeloaosol.xyz/" />
    <meta property="og:site_name" content="Between Frames" />
    <meta
      property="og:title"
      content="Creative Technologist — Angelo AoSol | Between Frames"
    />
    <meta
      property="og:description"
      content="Creative technologist Angelo AoSol presents moving images, installations, and visual experiments in an interactive portfolio."
    />
    <meta
      property="og:image"
      content="https://angeloaosol.xyz/social-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A red sun with long rays against a black background"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Creative Technologist — Angelo AoSol | Between Frames"
    />
    <meta
      name="twitter:description"
      content="Creative technologist Angelo AoSol presents moving images, installations, and visual experiments in an interactive portfolio."
    />
    <meta
      name="twitter:image"
      content="https://angeloaosol.xyz/social-preview.png"
    />
    <title>Creative Technologist — Angelo AoSol | Between Frames</title>
    <link rel="stylesheet" href="/src/app/loading.css" />
  </head>
  <body>
    <div
      id="boot-loader"
      class="scene-loading"
      aria-label="Preparing the scene"
    >
      <div class="loading-assembly">
        <div class="loading-art" aria-hidden="true">
          <img
            class="loading-tether"
            src="/media/loading-tether.svg"
            alt=""
            fetchpriority="high"
            decoding="sync"
          />
          <div class="loading-sun">
            <img
              src="/favicon.svg"
              alt=""
              fetchpriority="high"
              decoding="sync"
            />
          </div>
          <div class="loading-television">
            <div class="loading-screen"><div class="loading-fluid"></div></div>
            <img
              class="loading-tv"
              src="/media/loading-tv-sketch.jpg"
              alt=""
              fetchpriority="high"
              decoding="sync"
            />
          </div>
        </div>
        <div>
          <span class="loading-caption">loading...</span>
        </div>
      </div>
    </div>
    <script>
      Promise.all(
        Array.from(document.querySelectorAll('#boot-loader img'), (image) =>
          image.decode(),
        ),
      )
        .then(() => {
          document.getElementById('boot-loader')?.classList.add('is-art-ready');
        })
        .catch(() => {});
    </script>
    <noscript
      ><style>
        #boot-loader {
          display: none;
        }</style
      >This portfolio requires JavaScript for its interactive scene.</noscript
    >
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
